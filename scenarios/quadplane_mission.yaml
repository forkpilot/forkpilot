name: quadplane_mission
vehicle: plane
frame: quadplane
# VTOL delivery-style flight: vertical takeoff, transition to wing-borne flight, two legs,
# back to hover on the way home and a vertical landing at home
steps:
  - mission:
      - vtol_takeoff: 30
      - wp: [400, 0, 50]
      - wp: [400, 400, 50]
      - wp: [-200, 400, 50]
      - vtol_land: [0, 0]
  - takeoff: {alt: 30, mode: AUTO}
  - wait_disarm: 400
expect:
  mission_wp_reached: {ge: 4}
  landing_offset_m: {lt: 5}        # vertical landing on the point
  airspeed_min_mps: {gt: 13}       # AIRSPEED_MIN in default_params/quadplane.parm
